[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-rag"
version = "0.1.0"
description = "Production-grade Document Intelligence & Agentic RAG Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.1",
    "pydantic>=2.7.4",
    "pydantic-settings>=2.3.4",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.1.19",
    "aiosqlite>=0.20.0",
    "bcrypt>=4.1.3",
    "pyjwt[crypto]>=2.8.0",
    "email-validator>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.7",
    "httpx>=0.27.0",
    "ruff>=0.4.9",
    "pre-commit>=3.7.1",
    "tiktoken>=0.7.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "qdrant-client>=1.12.0",
]
parsing = [
    "unstructured[local-inference]>=0.14.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "tiktoken>=0.7.0",
]
retrieval = [
    "qdrant-client>=1.12.0",
    "fastembed>=0.4.0",
]
llm = [
    "groq>=0.11.0",
    "httpx>=0.27.0",
    "langgraph>=0.2.0",
]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["apps*", "packages*"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["backend/infra/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "B008"] # Allow assert in pytest and FastAPI Depends in route signatures

[tool.ruff.lint.isort]
known-first-party = ["app", "packages"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
asyncio_mode = "auto"
testpaths = ["backend/tests"]
pythonpath = [".", "backend", "backend/apps/api"]
